<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f2eb" />
  <title>Klubben</title>
  <style>
    :root {
      --bg: #f5f2eb;
      --card: #fffdf8;
      --text: #20252b;
      --blue: #2f708c;
      --red: #b43b42;
      --line: #ded8cc;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(47,112,140,.10), transparent 32%),
        radial-gradient(circle at 88% 86%, rgba(180,59,66,.07), transparent 30%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(30px, 6vw, 64px);
      box-shadow: 0 18px 50px rgba(32,37,43,.09);
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .logo {
      display: block;
      width: min(300px, 76vw);
      height: auto;
      margin: 0 auto 38px;
      border-radius: 18px;
      box-shadow: 0 14px 34px rgba(0,0,0,.16);
    }

    .instructions {
      display: grid;
      gap: 30px;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.35;
    }

    .instructions p { margin: 0; }

    .divider {
      width: 72px;
      height: 1px;
      background: var(--line);
      margin: 42px auto 34px;
    }

    .emergency-label {
      margin: 0 0 16px;
      color: var(--red);
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 750;
    }

    .phone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 64px;
      padding: 14px 24px;
      border-radius: 999px;
      border: 1px solid rgba(180,59,66,.24);
      background: rgba(180,59,66,.06);
      color: var(--text);
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 650;
      text-decoration: none;
    }

    .phone:hover, .phone:focus-visible {
      background: rgba(180,59,66,.11);
      outline: none;
    }

    @media (max-width: 520px) {
      body { padding: 14px; }
      main { border-radius: 18px; padding: 30px 20px 34px; }
      .logo { width: min(250px, 78vw); margin-bottom: 30px; }
      .instructions { gap: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Klubben</h1>
    <img class="logo" src="assets/klubben-logo.svg" alt="Klubben" />

    <section class="instructions" aria-label="Instruksjoner">
      <p>Skriv navnet ditt i boka og klokkeslettet du kommer!</p>
      <p>Skriv en «X» etter navnet ditt når du går og si ifra til Sarah eller Sepehr at du går!</p>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <p class="emergency-label">Ved nødstilfelle, ring:</p>
    <a class="phone" href="tel:+4740232347" aria-label="Ring Sarah på 40232347">Sarah: 40232347</a>
  </main>
</body>
</html>
