<!doctype html>
<!-- Routine maintenance -->
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; media-src 'self' https://infoskjermen-video-gateway.sepehr-infoskjermen.workers.dev; script-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://sepehrhaghighi.github.io data:; font-src 'self' data:; connect-src 'self' https://api.met.no; frame-src 'self' https://sepehrhaghighi.github.io https://vis-tavla.entur.no https://script.google.com https://script.googleusercontent.com; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Landscape – Films + Arrangements</title>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }

    .stage{
      position:relative;
      width:100%;
      height:100%;
      z-index:1;
    }

    .layer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      opacity:0;
      transition: opacity 900ms ease-in-out;
      will-change: opacity;
    }

    .layer.show{
      opacity:1;
    }

    #empty{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:#000;
      text-align:center;
      padding:40px;
      font:26px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index:2000;
    }

    .qrWrap{
      position:fixed;
      right:20px;
      bottom:20px;
      z-index:1000;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      pointer-events:none;

      opacity:0;
      transition: opacity 900ms ease-in-out;
      will-change: opacity;
    }

    .qrWrap.show{
      opacity:1;
    }

    .qrImg{
      width:146px;
      height:146px;
      object-fit:contain;
      background:rgba(255,255,255,0.97);
      padding:10px;
      border-radius:16px;
      box-shadow:
        0 14px 34px rgba(0,0,0,0.50),
        0 3px 10px rgba(0,0,0,0.30);
    }

    .qrText{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      color:#fff;
      background:rgba(0,0,0,0.74);
      padding:9px 14px;
      border-radius:14px;
      box-shadow:
        0 10px 24px rgba(0,0,0,0.38),
        0 2px 8px rgba(0,0,0,0.24);
      text-align:center;
      line-height:1.15;
      white-space:nowrap;
    }

    .qrMain{
      font:16px/1.15 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing:0.2px;
    }

    .qrSub{
      font:14px/1.15 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      opacity:0.95;
      letter-spacing:0.15px;
    }

    .dateLayer{
      position:fixed;
      left:22px;
      bottom:22px;
      z-index:900;
      opacity:0;
      transition: opacity 900ms ease-in-out;
      will-change: opacity;

      color:#fff;
      background:rgba(0,0,0,0.74);
      padding:10px 16px;
      border-radius:14px;
      box-shadow:
        0 10px 26px rgba(0,0,0,0.45),
        0 2px 8px rgba(0,0,0,0.28);

      font:24px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing:0.2px;
      pointer-events:none;
      white-space:nowrap;
      max-width:calc(100vw - 260px);
      overflow:hidden;
      text-overflow:ellipsis;

      /* Bypassed for now. Remove this line to show date/time again. */
      display: none !important;
    }

    .dateLayer.show{
      opacity:1;
    }
  </style>
</head>
<body>
  <div id="empty">No landscape posters available.</div>

  <div class="stage">
    <img id="a" class="layer show" alt="">
    <img id="b" class="layer" alt="">
  </div>

  <div id="qrWrap" class="qrWrap">
    <img id="qrImg" class="qrImg" src="./assets/QR.png" alt="QR code" data-hide-on-error="opacity">
    <div class="qrText">
      <div class="qrMain">Les mer - Kjøp billett</div>
      <div class="qrSub">www.amotkulturhus.no</div>
    </div>
  </div>

  <div id="dateA" class="dateLayer"></div>
  <div id="dateB" class="dateLayer"></div>

<script src="./entur-slide.js"></script>
<script src="./kiosk-auto-reload.js"></script>
<script src="./signage-video.js"></script>
<script src="./film-title-matching.js"></script>
<script src="./landscape-all-runtime.js"></script>
</body>
</html>
