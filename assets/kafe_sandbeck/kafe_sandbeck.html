<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kafé Sandbeck</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .poster {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      opacity: 0;

      transition: opacity 300ms ease-in-out;

      background: #000;
    }

    .poster.show {
      opacity: 1;
    }

    #message {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      color: #fff;
      background: #000;

      font-family: system-ui, sans-serif;
      font-size: 24px;

      text-align: center;
    }
  </style>
</head>

<body>

  <div id="stage">

    <img id="posterA" class="poster" alt="">
    <img id="posterB" class="poster" alt="">

    <div id="message">
      Ingen bilder tilgjengelig.
    </div>

  </div>


  <script>
    (() => {

      /* =====================================================
         SETTINGS
         ===================================================== */

      const DISPLAY_TIME = 10000; // 10 seconds
      const FADE_TIME = 300;      // 300 ms

      /*
       * Check GitHub every five minutes for added/removed
       * posters.
       *
       * This is intentionally not every few seconds because
       * the public GitHub API has rate limits.
       */
      const FOLDER_REFRESH_TIME = 5 * 60 * 1000;


      const API_URL =
        "https://api.github.com/repos/" +
        "sepehrhaghighi/infoskjermen-media/" +
        "contents/assets/kafe_sandbeck" +
        "?ref=main";


      /* =====================================================
         ELEMENTS
         ===================================================== */

      const posterA =
        document.getElementById("posterA");

      const posterB =
        document.getElementById("posterB");

      const message =
        document.getElementById("message");


      /* =====================================================
         STATE
         ===================================================== */

      let posters = [];

      let currentIndex = 0;

      let frontIsA = true;

      let slideTimer = null;


      /* =====================================================
         IMAGE FILE CHECK
         ===================================================== */

      function isImageFile(filename) {

        return /\.(jpg|jpeg|png|webp|gif|avif)$/i
          .test(filename);

      }


      /* =====================================================
         READ THE KAFE SANDBECK FOLDER
         ===================================================== */

      async function loadPosterList() {

        try {

          const response =
            await fetch(
              API_URL + "&_=" + Date.now(),
              {
                cache: "no-store",
                headers: {
                  "Accept": "application/vnd.github+json"
                }
              }
            );


          if (!response.ok) {

            throw new Error(
              "GitHub API returned " +
              response.status
            );

          }


          const files =
            await response.json();


          const newPosters =
            files

              .filter(file =>
                file.type === "file" &&
                isImageFile(file.name) &&
                file.download_url
              )

              .sort((a, b) =>
                a.name.localeCompare(
                  b.name,
                  undefined,
                  {
                    numeric: true,
                    sensitivity: "base"
                  }
                )
              )

              .map(file => ({
                name: file.name,
                url: file.download_url
              }));


          if (!newPosters.length) {

            posters = [];

            posterA.classList.remove("show");
            posterB.classList.remove("show");

            message.style.display = "flex";

            return;

          }


          message.style.display = "none";


          /*
           * Remember which poster is currently visible
           * so refreshing the folder does not suddenly
           * restart the slideshow.
           */

          const currentPoster =
            posters[currentIndex]?.name;


          posters = newPosters;


          if (currentPoster) {

            const newIndex =
              posters.findIndex(
                poster =>
                  poster.name === currentPoster
              );


            if (newIndex !== -1) {

              currentIndex = newIndex;

            } else {

              currentIndex = 0;

            }

          }


        } catch (error) {

          console.error(
            "Could not read Kafé Sandbeck folder:",
            error
          );


          /*
           * If posters were already loaded, keep showing
           * them even if GitHub temporarily cannot be
           * reached.
           */

          if (!posters.length) {

            message.textContent =
              "Kunne ikke laste bilder.";

            message.style.display = "flex";

          }

        }

      }


      /* =====================================================
         PRELOAD IMAGE
         ===================================================== */

      function preload(url) {

        return new Promise(resolve => {

          const img = new Image();


          img.onload = () =>
            resolve(true);


          img.onerror = () =>
            resolve(false);


          img.src = url;

        });

      }


      /* =====================================================
         SHOW FIRST POSTER
         ===================================================== */

      async function showFirstPoster() {

        if (!posters.length) {
          return;
        }


        currentIndex = 0;


        const poster =
          posters[currentIndex];


        const loaded =
          await preload(poster.url);


        if (!loaded) {

          nextPoster();

          return;

        }


        posterA.src =
          poster.url;


        posterA.classList.add("show");

        posterB.classList.remove("show");


        frontIsA = true;


        scheduleNextPoster();

      }


      /* =====================================================
         GO TO NEXT POSTER
         ===================================================== */

      async function nextPoster() {

        clearTimeout(slideTimer);


        if (!posters.length) {
          return;
        }


        /*
         * If only one poster exists, simply leave it
         * on screen.
         */

        if (posters.length === 1) {

          scheduleNextPoster();

          return;

        }


        currentIndex =
          (currentIndex + 1) %
          posters.length;


        const poster =
          posters[currentIndex];


        const loaded =
          await preload(poster.url);


        /*
         * Skip an image if it cannot be loaded.
         */

        if (!loaded) {

          scheduleNextPoster(500);

          return;

        }


        const front =
          frontIsA
            ? posterA
            : posterB;


        const back =
          frontIsA
            ? posterB
            : posterA;


        /*
         * Load next poster into hidden layer.
         */

        back.src =
          poster.url;


        /*
         * Give the browser a frame to render the new
         * image before starting the crossfade.
         */

        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            back.classList.add("show");

            front.classList.remove("show");


            frontIsA =
              !frontIsA;


            /*
             * Remove old image after fade has completed.
             */

            setTimeout(() => {

              front.src = "";

            }, FADE_TIME);


            scheduleNextPoster();

          });

        });

      }


      /* =====================================================
         TIMER
         ===================================================== */

      function scheduleNextPoster(
        delay = DISPLAY_TIME
      ) {

        clearTimeout(slideTimer);


        slideTimer =
          setTimeout(
            nextPoster,
            delay
          );

      }


      /* =====================================================
         CHECK FOLDER FOR CHANGES
         ===================================================== */

      async function refreshFolder() {

        await loadPosterList();


        setTimeout(
          refreshFolder,
          FOLDER_REFRESH_TIME
        );

      }


      /* =====================================================
         START
         ===================================================== */

      async function start() {

        await loadPosterList();


        if (posters.length) {

          await showFirstPoster();

        }


        setTimeout(
          refreshFolder,
          FOLDER_REFRESH_TIME
        );

      }


      start();


    })();
  </script>

</body>
</html>
