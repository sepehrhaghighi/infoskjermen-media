<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kafé Sandbeck</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .poster {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      opacity: 0;

      transition: opacity 300ms ease-in-out;

      background: #000;
    }

    .poster.show {
      opacity: 1;
    }

    #message {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      color: #fff;
      background: #000;

      font: 24px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

      text-align: center;
    }
  </style>
</head>

<body>

  <div id="stage">
    <img id="posterA" class="poster" alt="">
    <img id="posterB" class="poster" alt="">

    <div id="message">
      Ingen bilder tilgjengelig.
    </div>
  </div>


  <script>
    (async () => {

      /* =====================================================
         SETTINGS
         ===================================================== */

      const ASSET_FOLDER =
        "./assets/kafe_sandbeck/";

      const MANIFEST_URL =
        "./assets/kafe_sandbeck/manifest.json";

      // Each poster stays for 10 seconds
      const DISPLAY_TIME = 10000;

      // Crossfade duration
      const FADE_TIME = 300;

      // Check Power Automate's manifest every 60 seconds
      const REFRESH_TIME = 60000;


      /* =====================================================
         ELEMENTS
         ===================================================== */

      const posterA =
        document.getElementById("posterA");

      const posterB =
        document.getElementById("posterB");

      const message =
        document.getElementById("message");


      /* =====================================================
         STATE
         ===================================================== */

      let posters = [];

      let currentIndex = 0;

      let frontIsA = true;

      let slideshowTimer = null;

      let refreshTimer = null;

      let started = false;


      /* =====================================================
         BUILD IMAGE URL
         ===================================================== */

      function buildImageUrl(item) {

        if (!item || !item.name) {
          return "";
        }

        /*
         * IMPORTANT:
         *
         * We DO NOT use:
         *
         * item.url
         *
         * because Power Automate currently writes the
         * old landscape_extra_arrangements path there.
         *
         * Instead, we know that all these images belong
         * inside assets/kafe_sandbeck/.
         */

        let url =
          ASSET_FOLDER +
          encodeURIComponent(item.name);


        /*
         * Use the version timestamp created by
         * Power Automate as cache busting.
         */

        if (item.v) {

          url +=
            "?v=" +
            encodeURIComponent(item.v);

        }


        return url;
      }


      /* =====================================================
         LOAD MANIFEST
         ===================================================== */

      async function loadManifest() {

        try {

          const response =
            await fetch(
              MANIFEST_URL +
              "?_=" +
              Date.now(),
              {
                cache: "no-store"
              }
            );


          if (!response.ok) {

            throw new Error(
              "Manifest error: " +
              response.status
            );

          }


          const data =
            await response.json();


          const manifestItems =
            Array.isArray(data.items)
              ? data.items
              : [];


          const newPosters =
            manifestItems

              .filter(item =>
                item &&
                item.name &&
                /\.(jpg|jpeg|png|webp|gif|avif)$/i
                  .test(item.name)
              )

              .map(item => ({
                name: item.name,
                url: buildImageUrl(item),
                version: item.v || ""
              }));


          /* ---------------------------------------------
             NO POSTERS
             --------------------------------------------- */

          if (!newPosters.length) {

            posters = [];

            posterA.classList.remove("show");
            posterB.classList.remove("show");

            message.style.display = "flex";

            return;

          }


          message.style.display = "none";


          /* ---------------------------------------------
             CHECK IF MANIFEST CHANGED
             --------------------------------------------- */

          const oldSignature =
            JSON.stringify(
              posters.map(
                p => [p.name, p.version]
              )
            );


          const newSignature =
            JSON.stringify(
              newPosters.map(
                p => [p.name, p.version]
              )
            );


          const changed =
            oldSignature !== newSignature;


          posters =
            newPosters;


          /*
           * Don't restart the screen every time we
           * refresh manifest.json.
           *
           * Only make sure index is still valid.
           */

          if (
            changed &&
            currentIndex >= posters.length
          ) {

            currentIndex = 0;

          }


          return changed;


        } catch (error) {

          console.error(
            "Could not load Kafé Sandbeck manifest:",
            error
          );


          /*
           * If images were already loaded,
           * keep showing them.
           */

          if (!posters.length) {

            message.textContent =
              "Kunne ikke laste bilder.";

            message.style.display =
              "flex";

          }


          return false;

        }

      }


      /* =====================================================
         PRELOAD IMAGE
         ===================================================== */

      function preloadImage(url) {

        return new Promise(resolve => {

          const img =
            new Image();


          img.onload =
            () => resolve(true);


          img.onerror =
            () => resolve(false);


          img.src =
            url;

        });

      }


      /* =====================================================
         SHOW FIRST POSTER
         ===================================================== */

      async function showFirstPoster() {

        if (!posters.length) {
          return;
        }


        currentIndex = 0;


        const poster =
          posters[0];


        const loaded =
          await preloadImage(
            poster.url
          );


        if (!loaded) {

          currentIndex = 1;

          scheduleNext(500);

          return;

        }


        posterA.src =
          poster.url;


        posterA.classList.add(
          "show"
        );


        posterB.classList.remove(
          "show"
        );


        frontIsA =
          true;


        currentIndex =
          1;


        started =
          true;


        scheduleNext();

      }


      /* =====================================================
         SHOW NEXT POSTER
         ===================================================== */

      async function showNextPoster() {

        clearTimeout(
          slideshowTimer
        );


        if (!posters.length) {
          return;
        }


        /*
         * Only one poster:
         * simply leave it displayed.
         */

        if (posters.length === 1) {

          const poster =
            posters[0];


          const front =
            frontIsA
              ? posterA
              : posterB;


          /*
           * Update the image if Power Automate
           * replaced it with a new version.
           */

          if (front.src !== poster.url) {

            front.src =
              poster.url;

          }


          scheduleNext();

          return;

        }


        const poster =
          posters[
            currentIndex %
            posters.length
          ];


        currentIndex =
          (currentIndex + 1) %
          posters.length;


        const loaded =
          await preloadImage(
            poster.url
          );


        /*
         * If one image is temporarily broken,
         * skip it instead of freezing the display.
         */

        if (!loaded) {

          scheduleNext(500);

          return;

        }


        const front =
          frontIsA
            ? posterA
            : posterB;


        const back =
          frontIsA
            ? posterB
            : posterA;


        /*
         * Put next image behind current image.
         */

        back.src =
          poster.url;


        /*
         * Give the browser time to render it
         * before starting the 300 ms fade.
         */

        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            back.classList.add(
              "show"
            );


            front.classList.remove(
              "show"
            );


            frontIsA =
              !frontIsA;


            /*
             * After fade finishes, clear the old
             * image to avoid unnecessary memory use.
             */

            setTimeout(() => {

              front.src = "";

            }, FADE_TIME + 50);


            scheduleNext();

          });

        });

      }


      /* =====================================================
         SLIDESHOW TIMER
         ===================================================== */

      function scheduleNext(
        delay = DISPLAY_TIME
      ) {

        clearTimeout(
          slideshowTimer
        );


        slideshowTimer =
          setTimeout(
            showNextPoster,
            delay
          );

      }


      /* =====================================================
         REFRESH MANIFEST
         ===================================================== */

      async function refreshManifest() {

        await loadManifest();


        /*
         * If the folder used to be empty and Power
         * Automate later adds an image, start the
         * slideshow automatically.
         */

        if (
          posters.length &&
          !started
        ) {

          await showFirstPoster();

        }


        refreshTimer =
          setTimeout(
            refreshManifest,
            REFRESH_TIME
          );

      }


      /* =====================================================
         START
         ===================================================== */

      await loadManifest();


      if (posters.length) {

        await showFirstPoster();

      }


      refreshTimer =
        setTimeout(
          refreshManifest,
          REFRESH_TIME
        );


    })();
  </script>

</body>
</html>
