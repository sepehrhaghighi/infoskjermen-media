<!doctype html>
<!-- Routine maintenance -->
<html lang="no">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; media-src 'self' https://infoskjermen-video-gateway.sepehr-infoskjermen.workers.dev; script-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://sepehrhaghighi.github.io data:; font-src 'self' data:; connect-src 'self' https://api.met.no; frame-src 'self' https://sepehrhaghighi.github.io https://vis-tavla.entur.no https://script.google.com https://script.googleusercontent.com; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Films – Landscape</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #posterScene,
    #calendarScene,
    #enturScene {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 900ms ease-in-out;
      will-change: opacity;
    }

    #posterScene { z-index: 1; }
    #calendarScene,
    #enturScene {
      z-index: 2;
      background: #000;
    }

    #posterScene.active,
    #calendarScene.active,
    #enturScene.active {
      opacity: 1;
      pointer-events: auto;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 900ms ease-in-out;
      will-change: opacity;
    }

    .layer.show { opacity: 1; }

    #empty {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #000;
      text-align: center;
      padding: 40px;
      font: 26px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 100;
    }

    #calendarFrame,
    #enturFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="empty">No film landscape posters available.</div>

  <div id="posterScene">
    <div class="stage">
      <img id="a" class="layer show" alt="">
      <img id="b" class="layer" alt="">
    </div>
  </div>

  <div id="calendarScene">
    <iframe
      id="calendarFrame"
      title="Kalenderslide"
      loading="eager"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <div id="enturScene">
    <iframe id="enturFrame" title="Entur avgangstavle" loading="eager" referrerpolicy="no-referrer"></iframe>
  </div>

<script src="./kiosk-auto-reload.js"></script>
<script src="./signage-video.js"></script>
<script src="./film-title-matching.js"></script>
<script src="./films-landscape-runtime.js"></script>
</body>
</html>
