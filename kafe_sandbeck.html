  <meta name="referrer" content="no-referrer">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kafé Sandbeck">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./kafe-sandbeck.webmanifest">

  <title>Kafé Sandbeck</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      object-fit: contain;
      background: #000;

      opacity: 0;
      transition: opacity 300ms ease-in-out;
    }

    .poster.show {
      opacity: 1;
    }

    #message {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      color: #fff;
      background: #000;

      font: 24px system-ui, sans-serif;
    }
  </style>
</head>

<body>

  <div id="stage" class="stage">
    <img id="posterA" class="poster" alt="">
    <img id="posterB" class="poster" alt="">

    <div id="message">
      Ingen bilder tilgjengelig.
    </div>
  </div>

  <script src="./kiosk-auto-reload.js"></script>
<script src="./signage-video.js"></script>
<script src="./standalone-media-runtime.js"></script>

</body>
</html>
